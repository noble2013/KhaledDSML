name: Python tests

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,econometrics,plots,exports,unitroot,quantiles]'
      - name: Run all tests and validate source release guards
        run: |
          python -m pytest
          python tools/release_gate.py --target source

  distributed-integration:
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install optional Dask and Spark engines
        run: python -m pip install -e '.[dev,dask,spark]'
      - name: Run real Dask and Spark integration tests
        run: python -m pytest tests/test_distributed.py tests/test_distributed_analytics.py -v -rs

  notebook-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis and Office-export extras
        run: python -m pip install -e '.[dev,econometrics,plots,exports,unitroot,quantiles]'
      - name: Execute real teaching examples without Colab network installs
        run: python tools/notebook_smoke.py

  distributions:
    needs: [test, distributed-integration, notebook-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and test dependencies
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Check distribution metadata and archive completeness
        run: |
          python -m twine check dist/*
          python tools/check_distributions.py dist
          python tools/release_gate.py --target pypi --tag v0.10.0 --prerelease false
      - name: Verify clean wheel AND clean source distribution installs
        timeout-minutes: 24
        run: python tools/install_dist_smoke.py dist
      - name: Save validated release artifacts for manual inspection
        uses: actions/upload-artifact@v4
        with:
          name: khaled-dsml-0.10.0-validated-distributions
          path: dist/
          if-no-files-found: error
