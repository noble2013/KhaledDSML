name: Publish to TestPyPI (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type TESTPYPI to authorize publishing this prerelease to TestPyPI'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require manual publication only from reviewed main
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
      - name: Require explicit manual TestPyPI permission and non-stable version
        env:
          CONFIRM: ${{ inputs.confirm_publish }}
        run: python tools/release_gate.py --target testpypi --confirm "$CONFIRM"
      - name: Install test and packaging dependencies
        run: python -m pip install --upgrade build twine '.[dev,econometrics,plots,exports,unitroot,quantiles]'
      - name: Verify APIs and real offline teaching notebooks
        run: |
          python -m pytest
          python tools/notebook_smoke.py
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python tools/check_distributions.py dist
      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/khaled-dsml/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
