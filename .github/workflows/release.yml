name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refuse prerelease/dev source on stable PyPI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: python tools/release_gate.py --target pypi --tag "$RELEASE_TAG" --prerelease "$RELEASE_IS_PRERELEASE"
      - name: Install validation dependencies
        run: python -m pip install --upgrade build twine '.[dev,econometrics,plots,exports,unitroot,quantiles]'
      - name: Run tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python tools/check_distributions.py dist
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/khaled-dsml/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
